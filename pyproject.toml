[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfind-cli"
version = "0.1.0"
description = "Lead/sub-agent web research CLI powered by Qwen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "markdownify>=1.1.0",
  "mcp>=1.2",
  "openai>=2.15.0",
  "pypdf>=5.4.0",
  "uvicorn>=0.35.0",
  "websockets>=15.0",
]

[project.optional-dependencies]
local-llm = []
browser = [
  "playwright>=1.42.0",
]
media = [
  "accelerate>=0.20.0",
  "librosa>=0.10.0",
  "mlx-whisper>=0.4.0; sys_platform == 'darwin'",
  "qwen-asr",
  "torch==2.11.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
  "torch>=2.0.0; sys_platform == 'darwin'",
  "torchaudio==2.11.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
  "torchaudio>=2.0.0; sys_platform == 'darwin'",
  "transformers>=4.37.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
find-links = [
  "https://mirrors.aliyun.com/pytorch-wheels/cu130/",
]

[project.scripts]
deepfind = "deepfind.cli:main"
deepfind-web = "deepfind.web_api:main"

[tool.setuptools.packages.find]
include = ["deepfind*"]

[tool.setuptools.package-data]
deepfind = ["coding_seccomp.json"]
